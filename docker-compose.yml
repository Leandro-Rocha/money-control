name: money-control

services:
  money-control:
    image: money-control:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: money-control
    restart: unless-stopped
    ports:
      - "${MONEY_CONTROL_PORT:-3050}:3000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/login', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
